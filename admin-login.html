<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login - RAH Vehicle Exports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/agent-system.css" />
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 80px 24px;
        }
        .login-box {
            max-width: 420px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 40px 36px;
        }
        .login-box .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-box .logo img {
            height: 48px;
            width: auto;
            margin-bottom: 8px;
        }
        .login-box .logo h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .login-box .logo h2 span {
            color: var(--gold);
        }
        .login-box .logo .badge-admin {
            display: inline-block;
            padding: 2px 16px;
            border-radius: 20px;
            background: rgba(220, 26, 26, 0.15);
            color: var(--red);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .login-box .form-group {
            margin-bottom: 16px;
        }
        .login-box .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .login-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .login-box .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255,255,255,0.05);
        }
        .login-box .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0;
            font-size: 0.85rem;
        }
        .login-box .form-options label {
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .login-box .form-options a {
            color: var(--gold);
            text-decoration: none;
        }
        .login-box .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
        }
        .login-box .back-home {
            text-align: center;
            margin-top: 16px;
        }
        .login-box .back-home a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .login-box .back-home a:hover {
            color: #fff;
        }
        .login-box .demo-credentials {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            border: 1px dashed var(--border-glass);
        }
        .login-box .demo-credentials strong {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="preloader-ring"></div>
        <div class="preloader-text">RAH <span>Vehicle Exports</span></div>
    </div>

    <section class="login-page">
        <div class="login-box" data-aos="fade-up">
            <div class="logo">
                <img src="images/logo.png" alt="RAH" onerror="this.style.display='none'">
                <h2>RAH<span>.</span> Admin</h2>
                <span class="badge-admin">Secure Access</span>
            </div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="adminUsername" placeholder="Enter username" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter password" required />
                </div>

                <div class="form-options">
                    <label><input type="checkbox" /> Remember Me</label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span class="shine"></span>
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="demo-credentials">
                <strong>Demo Credentials</strong><br />
                Username: <strong>admin</strong> | Password: <strong>rah2025</strong>
            </div>

            <div class="back-home">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/agent-system.js"></script>
    <script>
        (function() {
            function hidePreloader() {
                var preloader = document.getElementById('preloader');
                if (preloader) preloader.classList.add('hide');
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', hidePreloader);
            } else { hidePreloader(); }
            setTimeout(hidePreloader, 2000);
            window.addEventListener('load', function() { setTimeout(hidePreloader, 300); });
        })();
    </script>
</body>
</html>
